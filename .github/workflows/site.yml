name: Site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: index.html and the CSP headers match the template
        run: |
          python website/src/build.py
          git diff --exit-code website/index.html website/vercel.json website/blog
          test -z "$(git status --porcelain website/blog)"
      - name: KEV feed builder rejects hostile input
        run: pip install pytest && python -m pytest -q tests
      - name: Scripts parse
        run: node --check website/term.js
      - name: No em dashes on the site
        run: "! grep -rn $'\\u2014' website/index.html website/term.js website/blog website/blog.css"
